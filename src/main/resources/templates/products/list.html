<!DOCTYPE html>
<html lang="vi"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách sản phẩm (Ví dụ 3 - Multi Image)</h2>
        <a class="btn btn-primary" th:href="@{/products/create}">+ Thêm sản phẩm</a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- SEARCH & PAGE SIZE -->
    <form class="row mt-3 mb-3 g-2" method="get" th:action="@{/products}">
        <div class="col-md-6">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập tên sản phẩm...">
        </div>
        <div class="col-md-2">
            <select class="form-select" name="size" onchange="this.form.submit()">
                <option value="5" th:selected="${size == 5}">5</option>
                <option value="10" th:selected="${size == 10}">10</option>
                <option value="20" th:selected="${size == 20}">20</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-success w-100" type="submit">Tìm kiếm</button>
        </div>
    </form>

    <!-- TABLE -->
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Thương hiệu</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Mô tả</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products.content}">
            <td th:text="${product.id}"></td>
            <td>
                <div class="d-flex gap-2 flex-wrap" th:if="${product.images != null and !#lists.isEmpty(product.images)}">
                    <img th:each="image : ${product.images}"
                         th:if="${image.primary}"
                         th:src="@{'/uploads/products/' + ${image.imageUrl}}"
                         th:alt="${product.name}"
                         style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px;">
                </div>
                <span th:if="${product.images == null or #lists.isEmpty(product.images)}" class="text-muted">Chưa có ảnh</span>
            </td>
            <td th:text="${product.name}" class="fw-bold"></td>
            <td th:text="${product.brand != null ? product.brand : '-'}"></td>
            <td>
                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')} + ' VNĐ'"></span>
            </td>
            <td th:text="${product.quantity}"></td>
            <td th:text="${product.description}"></td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{/products/edit/{id}(id=${product.id})}">Sửa</a>
                <a class="btn btn-danger btn-sm"
                   th:href="@{/products/delete/{id}(id=${product.id})}"
                   onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- EMPTY NOTICE -->
    <div class="alert alert-warning" th:if="${products.totalElements == 0}">
        Không tìm thấy sản phẩm.
    </div>

    <!-- PAGINATION -->
    <nav th:if="${products.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <!-- Previous -->
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number - 1}, size=${size}, keyword=${keyword})}">Previous</a>
            </li>
            <!-- Page Numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/products(page=${i}, size=${size}, keyword=${keyword})}"></a>
            </li>
            <!-- Next -->
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number + 1}, size=${size}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
