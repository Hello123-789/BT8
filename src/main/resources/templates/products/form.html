<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${formTitle}">Product Form</title>
</head>
<body>
<section layout:fragment="content">
    <h2 th:text="${formTitle}">Product Form</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post"
          enctype="multipart/form-data"
          th:object="${product}"
          th:action="${product.id == null} ? @{/products/create} : @{/products/edit/{id}(id=${product.id})}">
        <input type="hidden" th:field="*{id}">

        <!-- NAME -->
        <div class="mb-3">
            <label class="form-label fw-bold">Tên sản phẩm</label>
            <input type="text" class="form-control" th:field="*{name}">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- BRAND -->
        <div class="mb-3">
            <label class="form-label fw-bold">Thương hiệu</label>
            <input type="text" class="form-control" th:field="*{brand}" placeholder="Ví dụ: Yonex, Victor, Li-Ning...">
        </div>

        <!-- PRICE -->
        <div class="mb-3">
            <label class="form-label fw-bold">Giá (VNĐ)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}">
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <!-- QUANTITY -->
        <div class="mb-3">
            <label class="form-label fw-bold">Số lượng</label>
            <input type="number" class="form-control" th:field="*{quantity}">
            <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>

        <!-- DESCRIPTION -->
        <div class="mb-3">
            <label class="form-label fw-bold">Mô tả</label>
            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <!-- CURRENT IMAGES (Multi-Image Gallery) -->
        <div class="mb-4" th:if="${product.images != null and !#lists.isEmpty(product.images)}">
            <label class="form-label fw-bold">Hình ảnh hiện tại</label>
            <div class="d-flex gap-3 flex-wrap">
                <div th:each="image : ${product.images}" class="card" style="width: 160px;">
                    <img th:src="@{'/uploads/products/' + ${image.imageUrl}}"
                         th:alt="${product.name}"
                         class="card-img-top"
                         style="width: 160px; height: 160px; object-fit: cover;">
                    <div class="card-body text-center p-2">
                        <div th:if="${image.primary}" class="mb-2">
                            <span class="badge bg-success">★ Ảnh chính</span>
                        </div>
                        <button type="button" class="btn btn-danger btn-sm w-100"
                                th:data-url="@{'/products/image/delete/' + ${image.id}}"
                                onclick="deleteImage(this)">🗑 Xóa ảnh</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- UPLOAD MULTIPLE IMAGES -->
        <div class="mb-3">
            <label class="form-label fw-bold">Thêm hình ảnh mới</label>
            <input type="file" class="form-control" name="imageFiles" multiple accept="image/*">
            <div class="form-text">Có thể chọn nhiều hình ảnh cùng lúc (định dạng JPG, PNG, WEBP).</div>
        </div>

        <!-- BUTTONS -->
        <button type="submit" class="btn btn-primary">💾 Lưu</button>
        <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
    </form>

    <script>
        function deleteImage(button) {
            if (!confirm("Bạn có chắc muốn xóa hình ảnh này?")) {
                return;
            }
            const url = button.getAttribute("data-url");
            fetch(url, {
                method: "POST",
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert("Không thể xóa hình ảnh!");
                }
            })
            .catch(error => {
                console.error(error);
                alert("Có lỗi xảy ra khi xóa hình ảnh!");
            });
        }
    </script>
</section>
</body>
</html>
